name: End-to-End Tests

on:
  push:
    branches: [gen0]
  pull_request:
    branches: [gen0]
  workflow_dispatch:

env:
  PLAYWRIGHT_REPORT_DIR: apps/tests-e2e/playwright-report/

permissions:
  pull-requests: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_PROJECT_ID }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm run test:e2e:install

      - name: Run Playwright tests
        run: pnpm run test:e2e

      - name: Deploy Report to Netlify
        id: netlify
        if: "!cancelled() && github.event_name == 'pull_request' && env.NETLIFY_AUTH_TOKEN != ''"
        uses: nwtgck/actions-netlify@v3
        with:
          publish-dir: ${{ env.PLAYWRIGHT_REPORT_DIR }}
          production-branch: gen0
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: 'Deploy from GitHub Actions'
          enable-pull-request-comment: false # We use a custom comment below
          enable-commit-comment: false
          overwrites-pull-request-comment: false

      - name: Comment PR with link to report
        uses: thollander/actions-comment-pull-request@v3
        if: "!cancelled() && steps.netlify.conclusion == 'success'"
        with:
          message: |
            ### 🎭 Playwright Report
            View the full test report for this PR:
            **${{ steps.netlify.outputs.deploy-url }}**
          comment-tag: playwright-report

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: ${{ env.PLAYWRIGHT_REPORT_DIR }}
          retention-days: 30
